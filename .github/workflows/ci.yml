name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: waypoint
          POSTGRES_PASSWORD: waypoint
          POSTGRES_DB: waypoint
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waypoint -d waypoint"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      WAYPOINT_TEST_DATABASE_URL: postgresql://waypoint:waypoint@localhost:5432/waypoint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run waypoint-agent init-db
      - run: uv run waypoint-agent run --export artifacts/trajectory.json
      - run: uv run python scripts/export_reschedule.py --output artifacts/reschedule-trajectory.json
      - name: Deterministic isolated benchmark
        run: uv run waypoint-agent benchmark --backend memory --repeats 2 --output artifacts/benchmark
      - name: PostgreSQL benchmark
        run: uv run waypoint-agent benchmark --backend postgres --output artifacts/benchmark-postgres
      - run: uv run pre-commit run --all-files
      - run: uv build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.python }}
          path: artifacts/
