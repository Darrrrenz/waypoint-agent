[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "waypoint-agent"
version = "0.1.0"
description = "An evidence-verified personal agent runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "tzdata>=2025.2",
]

[project.scripts]
waypoint-agent = "waypoint_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.11,<1", "pre-commit>=4,<5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a PostgreSQL server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
